name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ github.workspace }}/build/matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install 'torch>=2.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Install package and test tools
        run: python -m pip install -e '.[dev,reproduce]'
      - name: Lint and format
        run: |
          ruff check gaussian_crossings tests
          ruff format --check gaussian_crossings tests
      - name: Test
        run: python -m pytest -m 'not reproduction'
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build --outdir build/dist
