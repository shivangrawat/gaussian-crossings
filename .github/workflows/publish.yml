name: Publish to PyPI

# Runs when a GitHub release is published. Uses PyPI trusted publishing, so no API token is
# stored in the repository.
#
# One-time setup on pypi.org (Account settings -> Publishing -> Add a pending publisher):
#   PyPI project name: gaussian-crossings
#   Owner: shivangrawat    Repository name: gaussian-crossings
#   Workflow name: publish.yml    Environment name: pypi
#
# To release: set __version__ in gaussian_crossings/__init__.py and version in CITATION.cff,
# date the release in CHANGELOG.md, refresh uv.lock with `uv lock`, and run the test/doc checks.
# Then publish a GitHub release whose tag is v<version> (for example v0.2.0).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check that the release tag matches the package version
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('gaussian_crossings/__init__.py').read_text()).group(1))")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gaussian-crossings
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
