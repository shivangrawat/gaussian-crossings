[project]
name = "gaussian-crossings"
dynamic = ["version"]
description = "Exact mean, variance, and Fano factor of level crossings in stationary Gaussian processes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shivang Rawat" }]
keywords = [
    "Gaussian processes",
    "level crossings",
    "Kac-Rice formula",
    "Fano factor",
    "counting statistics",
    "stochastic processes",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
]

[project.urls]
Homepage = "https://shivangrawat.github.io/gaussian-crossings/"
Documentation = "https://shivangrawat.github.io/gaussian-crossings/"
Repository = "https://github.com/shivangrawat/gaussian-crossings"
Issues = "https://github.com/shivangrawat/gaussian-crossings/issues"
Changelog = "https://github.com/shivangrawat/gaussian-crossings/blob/main/CHANGELOG.md"
Paper = "https://arxiv.org/abs/2605.25278"

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7", "ruff>=0.9", "jupyter", "ipykernel>=6", "matplotlib>=3.7"]
notebooks = ["jupyterlab>=4", "ipykernel>=6", "nbclient>=0.10", "nbformat>=5.9", "joblib>=1.3", "tqdm>=4.65", "matplotlib>=3.7"]
reproduce = ["mpmath>=1.3", "matplotlib>=3.7"]
# Keep in sync with .github/workflows/docs.yml.
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "mkdocs-jupyter>=0.25"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "gaussian_crossings/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["gaussian_crossings"]

[tool.hatch.build.targets.sdist]
# The paper archive, notebooks, and documentation stay in the repository only.
include = ["/gaussian_crossings", "/README.md", "/CHANGELOG.md", "/CITATION.cff", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["reproduction: checks requiring the local, untracked figure archives"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
