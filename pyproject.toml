[project]
name = "gaussian-crossings"
version = "0.1.0"
description = "Mean, variance, and Fano factors of level crossings in stationary Gaussian processes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Shivang Rawat" }]
keywords = ["Gaussian processes", "level crossings", "Kac-Rice", "Fano factor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "torch>=2.0",
]

[project.urls]
Repository = "https://github.com/shivangrawat/gaussian-crossings"
Issues = "https://github.com/shivangrawat/gaussian-crossings/issues"
Paper = "https://arxiv.org/abs/2605.25278"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.9", "jupyter", "ipykernel>=6"]
notebooks = ["jupyterlab>=4", "ipykernel>=6", "nbclient>=0.10", "nbformat>=5.9", "joblib>=1.3", "tqdm>=4.65"]
reproduce = ["mpmath>=1.3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gaussian_crossings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["reproduction: checks requiring the local, untracked figure archives"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
